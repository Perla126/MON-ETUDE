<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MON-ÉTUDE</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  font-family:Arial,sans-serif;

}

body{

  background:linear-gradient(135deg,#eef2ff,#fff1f2,#ecfdf5);

  color:#1f2937;

}

header{

  background:linear-gradient(135deg,#4f46e5,#7c3aed,#ec4899);

  color:white;

  text-align:center;

  padding:45px 20px;

}

header h1{

  font-size:44px;

  margin-bottom:10px;

}

header p{

  font-size:18px;

}

.container{

  max-width:1100px;

  margin:30px auto;

  padding:20px;

}

.card{

  background:white;

  padding:30px;

  margin-bottom:25px;

  border-radius:22px;

  box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.welcome{

  text-align:center;

}

h2{

  color:#4f46e5;

  margin-bottom:20px;

  text-align:center;

}

label{

  display:block;

  margin:18px 0 8px;

  font-weight:bold;

  color:#7c3aed;

}

select{

  width:100%;

  padding:15px;

  border:2px solid #ddd6fe;

  border-radius:12px;

  font-size:16px;

  background:white;

}

.hidden{

  display:none;

}

.actions{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:15px;

  margin-top:25px;

}

.action{

  border:none;

  border-radius:16px;

  padding:20px 10px;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

.cours{background:#4f46e5;}

.exercices{background:#16a34a;}

.revisions{background:#ea580c;}

.quiz{background:#db2777;}

.content{

  margin-top:25px;

  padding:25px;

  border-radius:18px;

  background:#f5f3ff;

  line-height:1.8;

}

.content h3{

  color:#7c3aed;

  margin-bottom:15px;

}

footer{

  background:#312e81;

  color:white;

  text-align:center;

  padding:25px;

  margin-top:40px;

}

@media(max-width:700px){

  header h1{font-size:34px;}

  .actions{grid-template-columns:1fr 1fr;}

}

@media(max-width:450px){

  .actions{grid-template-columns:1fr;}

}

</style>

</head>

<body>

<header>

<h1>📚 MON-ÉTUDE</h1>

<p>Apprendre • Comprendre • Réviser • Réussir</p>

</header>

<main class="container">

<section class="card welcome">

<h2>👋 Bienvenue sur MON-ÉTUDE</h2>

<p>

Une application destinée aux lycéens et aux étudiants,

adaptée à leur domaine d'étude.

</p>

</section>

<section class="card">

<h2>🎓 Choisis ton parcours</h2>

<label>1️⃣ Catégorie</label>

<select id="categorie" onchange="chargerDomaines()">

<option value="">-- Choisis une catégorie --</option>

</select>

<div id="domaineZone" class="hidden">

<label>2️⃣ Domaine</label>

<select id="domaine" onchange="chargerMatieres()">

<option value="">-- Choisis un domaine --</option>

</select>

</div>

<div id="matiereZone" class="hidden">

<label>3️⃣ Matière</label>

<select id="matiere" onchange="afficherActions()">

<option value="">-- Choisis une matière --</option>

</select>

</div>

</section>

<section id="actionsZone" class="card hidden">

<h2>🚀 Ton espace d'étude</h2>

<p style="text-align:center;">

Choisis ce que tu veux faire.

</p>

<div class="actions">

<button class="action cours" onclick="afficherContenu('cours')">

📚 Cours

</button>

<button class="action exercices" onclick="afficherContenu('exercices')">

📝 Exercices

</button>

<button class="action revisions" onclick="afficherContenu('revisions')">

🔄 Révisions

</button>

<button class="action quiz" onclick="afficherContenu('quiz')">

🧠 Quiz

</button>

</div>

</section>

<section id="contenuZone" class="card hidden">

<h2 id="titreContenu"></h2>

<div class="content">

<h3 id="matiereTitre"></h3>

<p id="texteContenu"></p>

</div>

</section>

</main>

<footer>

<p>© 2026 MON-ÉTUDE — Apprendre autrement 🚀</p>

</footer>

/* =========================

   CHARGER LES CATÉGORIES

========================= */

const categorie =

document.getElementById("categorie");

Object.keys(donnees).forEach(function(nom){

const option=document.createElement("option");

option.value=nom;

option.textContent=nom;

categorie.appendChild(option);

});

/* =========================

   CHARGER LES DOMAINES

========================= */

function chargerDomaines(){

const cat=categorie.value;

const domaine=document.getElementById("domaine");

domaine.innerHTML=

'<option value="">-- Choisis un domaine --</option>';

document.getElementById("matiereZone")

.classList.add("hidden");

document.getElementById("actionsZone")

.classList.add("hidden");

document.getElementById("contenuZone")

.classList.add("hidden");

if(cat===""){

document.getElementById("domaineZone")

.classList.add("hidden");

return;

}

Object.keys(donnees[cat]).forEach(function(nom){

const option=document.createElement("option");

option.value=nom;

option.textContent=nom;

domaine.appendChild(option);

});

document.getElementById("domaineZone")

.classList.remove("hidden");

}

/* =========================

   CHARGER LES MATIÈRES

========================= */

function chargerMatieres(){

const cat=categorie.value;

const dom=document.getElementById("domaine").value;

const matiere=document.getElementById("matiere");

matiere.innerHTML=

'<option value="">-- Choisis une matière --</option>';

document.getElementById("actionsZone")

.classList.add("hidden");

document.getElementById("contenuZone")

.classList.add("hidden");

if(dom===""){

document.getElementById("matiereZone")

.classList.add("hidden");

return;

}

donnees[cat][dom].forEach(function(nom){

const option=document.createElement("option");

option.value=nom;

option.textContent=nom;

matiere.appendChild(option);

});

document.getElementById("matiereZone")

.classList.remove("hidden");

}

/* =========================

   AFFICHER LES 4 ÉLÉMENTS

========================= */

function afficherActions(){

const matiere=document.getElementById("matiere").value;

document.getElementById("contenuZone")

.classList.add("hidden");

if(matiere===""){

document.getElementById("actionsZone")

.classList.add("hidden");

return;

}

document.getElementById("actionsZone")

.classList.remove("hidden");

}

/* =========================

   AFFICHER LE CONTENU

========================= */

function afficherContenu(type){

const matiere=

document.getElementById("matiere").value;

const titre=

document.getElementById("titreContenu");

const titreMatiere=

document.getElementById("matiereTitre");

const texte=

document.getElementById("texteContenu");

const zone=

document.getElementById("contenuZone");

titreMatiere.textContent="📖 "+matiere;

if(type==="cours"){

titre.textContent="📚 Cours";

texte.textContent=

"Cette partie contient les cours de "+matiere+

". Les leçons détaillées, définitions, explications et exemples seront organisés ici.";

}

if(type==="exercices"){

titre.textContent="📝 Exercices";

texte.textContent=

"Cette partie contient des exercices de "+matiere+

", avec différents niveaux de difficulté pour permettre à l'étudiant de s'entraîner.";

}

if(type==="revisions"){

titre.textContent="🔄 Révisions";

texte.textContent=

"Cette partie permet de réviser "+matiere+

" grâce aux notions essentielles, résumés et fiches de révision.";

}

if(type==="quiz"){

titre.textContent="🧠 Quiz";

texte.textContent=

"Cette partie proposera des quiz interactifs sur "+matiere+

" afin de tester les connaissances de l'étudiant.";

}

zone.classList.remove("hidden");

zone.scrollIntoView({

behavior:"smooth"

});

}
